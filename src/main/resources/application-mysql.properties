# Perfil alternativo: MySQL (mismo motor que el proyecto de escritorio GestionAp)
# Activar con: --spring.profiles.active=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/gestionapdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=false

server.port=8080
