spring.application.name=gestionap-api

# Perfil por defecto: H2 en memoria (cero configuracion, ideal para probar/demo)
spring.datasource.url=jdbc:h2:mem:gestionapdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Necesario para que data.sql se ejecute DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
